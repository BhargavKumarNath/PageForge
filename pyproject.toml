[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pageforge"
version = "0.1.0"
description = "PageForge: Paged KV-cache memory manager for LLM inference — Rust + CUDA + Python"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "transformers>=5.0",
    "cupy-cuda12x>=14.0",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "toml>=0.10",
]

[project.scripts]
pageforge = "pageforge.cli:app"

[tool.setuptools]
packages = ["pageforge"]
